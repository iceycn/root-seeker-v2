name: Publish

# Images: Docker Hub wuhun0301/rootseeker-v2{,-zoekt,-gitnexus}
#          ACR ${ACR_NAMESPACE}/root-seeker{,-zoekt,-gitnexus}
on:
  push:
    branches: [main, master]
    paths:
      - "Dockerfile"
      - "docker/**"
      - "docker-compose.yml"
      - "apps/**"
      - "rootseeker/**"
      - "mcp_servers/**"
      - "plugins/**"
      - "skills/**"
      - "pyproject.toml"
      - ".dockerignore"
      - ".github/workflows/publish.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "要打到 Hub/ACR 的版本号（如 v1.3.0）。留空则用 sha-<7 位>"
        required: false
        type: string
        default: ""
      retag_only:
        description: "异常回填：不重建，把已有 latest 复制为上述版本号（Hub + ACR）"
        required: false
        type: boolean
        default: false

env:
  HUB_USER: wuhun0301
  ACR_REGISTRY: crpi-b41zzjy8qjnhgc6o.cn-hangzhou.personal.cr.aliyuncs.com
  ACR_NAMESPACE: root-seeker

jobs:
  retag-latest-to-version:
    name: Retag latest to version (Hub + ACR)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.retag_only == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require version input
        run: |
          if [[ -z "${{ github.event.inputs.version }}" ]]; then
            echo "retag_only 需要填写 version，例如 v1.3.0" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Copy latest manifests to version tag
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          copy_tag() {
            local src="$1"
            local dest="$2"
            echo "imagetools create ${dest} <- ${src}"
            docker buildx imagetools create --tag "${dest}" "${src}"
          }
          copy_tag "${HUB_USER}/rootseeker-v2:latest" "${HUB_USER}/rootseeker-v2:${VERSION}"
          copy_tag "${HUB_USER}/rootseeker-v2-zoekt:latest" "${HUB_USER}/rootseeker-v2-zoekt:${VERSION}"
          copy_tag "${HUB_USER}/rootseeker-v2-gitnexus:latest" "${HUB_USER}/rootseeker-v2-gitnexus:${VERSION}"
          copy_tag "${ACR_REGISTRY}/${ACR_NAMESPACE}/root-seeker:latest" "${ACR_REGISTRY}/${ACR_NAMESPACE}/root-seeker:${VERSION}"
          copy_tag "${ACR_REGISTRY}/${ACR_NAMESPACE}/root-seeker-zoekt:latest" "${ACR_REGISTRY}/${ACR_NAMESPACE}/root-seeker-zoekt:${VERSION}"
          copy_tag "${ACR_REGISTRY}/${ACR_NAMESPACE}/root-seeker-gitnexus:latest" "${ACR_REGISTRY}/${ACR_NAMESPACE}/root-seeker-gitnexus:${VERSION}"

  build-and-push:
    name: Build and Push Docker Images
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.retag_only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # GitHub-hosted Buildx otherwise attaches OCI provenance (empty json) that ACR rejects.
      BUILDX_NO_DEFAULT_ATTESTATIONS: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Resolve tags
        id: meta
        run: |
          INPUT_VERSION="${{ github.event.inputs.version }}"
          if [[ -n "${INPUT_VERSION}" ]]; then
            VERSION="${INPUT_VERSION}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="sha-${GITHUB_SHA::7}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Using image version ${VERSION}"

      - name: Ensure Zoekt binaries
        run: |
          if [[ ! -x docker/bin/zoekt-index || ! -x docker/bin/zoekt-webserver ]]; then
            bash docker/prepare-zoekt.sh
          fi

      - name: Build and push app (api/admin/worker/scheduler)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.HUB_USER }}/rootseeker-v2:latest
            ${{ env.HUB_USER }}/rootseeker-v2:${{ steps.meta.outputs.VERSION }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
          provenance: false
          sbom: false

      - name: Build and push zoekt
        uses: docker/build-push-action@v5
        with:
          context: ./docker
          file: docker/Dockerfile.zoekt
          push: true
          tags: |
            ${{ env.HUB_USER }}/rootseeker-v2-zoekt:latest
            ${{ env.HUB_USER }}/rootseeker-v2-zoekt:${{ steps.meta.outputs.VERSION }}
          cache-from: type=gha,scope=zoekt
          cache-to: type=gha,mode=max,scope=zoekt
          provenance: false
          sbom: false

      - name: Build and push gitnexus
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.gitnexus
          push: true
          tags: |
            ${{ env.HUB_USER }}/rootseeker-v2-gitnexus:latest
            ${{ env.HUB_USER }}/rootseeker-v2-gitnexus:${{ steps.meta.outputs.VERSION }}
          cache-from: type=gha,scope=gitnexus
          cache-to: type=gha,mode=max,scope=gitnexus
          provenance: false
          sbom: false

      - name: Mirror Hub images to ACR without OCI attestations
        env:
          VERSION: ${{ steps.meta.outputs.VERSION }}
        run: |
          set -euo pipefail
          mirror() {
            local hub_repo="$1"
            local acr_repo="$2"
            echo "mirror docker.io/${hub_repo}:${VERSION} -> ${acr_repo}"
            docker pull "docker.io/${hub_repo}:${VERSION}"
            docker tag "docker.io/${hub_repo}:${VERSION}" "${acr_repo}:${VERSION}"
            docker tag "docker.io/${hub_repo}:${VERSION}" "${acr_repo}:latest"
            docker push "${acr_repo}:${VERSION}"
            docker push "${acr_repo}:latest"
          }
          mirror "${HUB_USER}/rootseeker-v2" "${ACR_REGISTRY}/${ACR_NAMESPACE}/root-seeker"
          mirror "${HUB_USER}/rootseeker-v2-zoekt" "${ACR_REGISTRY}/${ACR_NAMESPACE}/root-seeker-zoekt"
          mirror "${HUB_USER}/rootseeker-v2-gitnexus" "${ACR_REGISTRY}/${ACR_NAMESPACE}/root-seeker-gitnexus"