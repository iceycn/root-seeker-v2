# 使用预构建镜像启动（无需本地 --build）
# 用法:
#   国际: DOCKERHUB_USER=wuhun0301 docker compose -f docker-compose.yml -f docker-compose.pull.yml up -d
#   国内: ROOTSEEKER_SETUP_REGION=cn ./setup-cn.sh --yes --path docker --storage mysql --pull
# 或:
#   ./start.sh --pull
#
# 可通过 APP_IMAGE / ZOEKT_IMAGE / GITNEXUS_IMAGE 覆盖仓库名（不含 tag）。

x-app-image: &app-image
  image: ${APP_IMAGE:-docker.io/wuhun0301/rootseeker-v2}:${IMAGE_TAG:-latest}
  pull_policy: missing

services:
  api:
    <<: *app-image
    build: !reset null

  admin:
    <<: *app-image
    build: !reset null

  worker:
    <<: *app-image
    build: !reset null

  scheduler:
    <<: *app-image
    build: !reset null

  zoekt:
    image: ${ZOEKT_IMAGE:-docker.io/wuhun0301/rootseeker-v2-zoekt}:${IMAGE_TAG:-latest}
    pull_policy: missing
    build: !reset null

  gitnexus:
    image: ${GITNEXUS_IMAGE:-docker.io/wuhun0301/rootseeker-v2-gitnexus}:${IMAGE_TAG:-latest}
    pull_policy: missing
    build: !reset null
